<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Voltage source: a pump adding pressure to the loop. -->
    <symbol id="pump" viewBox="0 0 40 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2 12h9m18 0h9"/><circle fill="currentColor" fill-opacity=".12" stroke="none" cx="20" cy="12" r="8.5"/><circle fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" cx="20" cy="12" r="8.5"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M16 16.5 24.5 12 16 7.5v9Z"/>
    </symbol>
    <!-- Resistance: a narrow section that restricts flow. -->
    <symbol id="restriction" viewBox="0 0 40 24">
      <path fill="currentColor" fill-opacity=".12" stroke="none" d="M2 5h11l5 4h4l5-4h11v14H27l-5-4h-4l-5 4H2Z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2 5h11l5 4h4l5-4h11M2 19h11l5-4h4l5 4h11"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 12h10m-3-2.5 3 2.5-3 2.5"/>
    </symbol>
    <!-- Capacitance: an elastic pressure accumulator. -->
    <symbol id="accumulator" viewBox="0 0 40 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2 12h11m14 0h11"/><rect fill="currentColor" fill-opacity=".12" stroke="none" x="13" y="3" width="14" height="18" rx="4"/><rect fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" x="13" y="3" width="14" height="18" rx="4"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M14 12c3-3 9-3 12 0M20 4v4m-2-2h4"/><path fill="#50a9c8" stroke="none" d="M14.7 14h10.6v3.3a2 2 0 0 1-2 2h-6.6a2 2 0 0 1-2-2Z"/>
    </symbol>
    <!-- Inductance: a flywheel carrying flow momentum. -->
    <symbol id="flywheel" viewBox="0 0 40 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2 12h8m20 0h8"/><circle fill="currentColor" fill-opacity=".12" stroke="none" cx="20" cy="12" r="9"/><circle fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" cx="20" cy="12" r="9"/><circle fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" cx="20" cy="12" r="2.2"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m20 9.8-3.5-5.6M17.9 13.2l-6.5 1.2m10.7-1.6 4.2 5.2"/>
    </symbol>
    <!-- Diode: a one-way check valve. -->
    <symbol id="check-valve" viewBox="0 0 40 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2 12h11m15 0h10"/><path fill="currentColor" fill-opacity=".12" stroke="none" d="m13 6 10 6-10 6Z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M13 6v12l10-6-10-6Zm14 0v12"/><circle fill="#50a9c8" stroke="none" cx="24.5" cy="12" r="2.1"/>
    </symbol>
    <!-- Switch: a manual shutoff valve. -->
    <symbol id="shutoff-valve" viewBox="0 0 40 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2 12h10m16 0h10M12 6l8 6-8 6V6Zm16 0-8 6 8 6V6ZM20 4v5m-4-5h8"/>
    </symbol>
    <!-- Transformer: two fluid wheels linked by a shaft. -->
    <symbol id="coupled-wheels" viewBox="0 0 40 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2 12h6m24 0h6M14 5v14m12-14v14M14 12h12"/><circle fill="currentColor" fill-opacity=".12" stroke="none" cx="14" cy="12" r="6"/><circle fill="currentColor" fill-opacity=".12" stroke="none" cx="26" cy="12" r="6"/><circle fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" cx="14" cy="12" r="6"/><circle fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" cx="26" cy="12" r="6"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m14 8-2.5 6.5m5-5L11 14m15-6-2.5 6.5m5-5L23 14"/>
    </symbol>
    <!-- Probe: a pressure or flow gauge attached to the pipe. -->
    <symbol id="gauge" viewBox="0 0 40 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2 18h36M20 18v-3"/><circle fill="currentColor" fill-opacity=".12" stroke="none" cx="20" cy="9" r="7"/><circle fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" cx="20" cy="9" r="7"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m20 9 4-3m-8.5 6.5h9M20 4v1"/><circle fill="#50a9c8" stroke="none" cx="20" cy="9" r="1.4"/>
    </symbol>
  </defs>
</svg>
